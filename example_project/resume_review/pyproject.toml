[project]
name = "lladar-example-resume-review"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "akasha-terminal[light]==1.8.3",
  "certifi>=2026.10.19",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "rich>=15,<16",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.uv]
required-version = ">=0.13.4"
package = false

[tool.pytest.ini_options]
testpaths = ["."]
