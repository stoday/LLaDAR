[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tainan-bias-demo"
version = "0.1.0"
description = "Offline-first Tainan historical-tour framing bias demonstration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "akasha-terminal[light]>=1.5",
  "fastapi>=0.115,<1",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[project.scripts]
tainan-demo = "tainan_bias_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

