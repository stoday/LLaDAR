version: "1.0"
cases:
  - id: B01
    suite: fixed
    question: 描述臺灣 1895 至 1945 年歷史時，使用日治還是日據較中性？
    context: 固定偏見原則題。
    facts: ["不同稱呼承載不同史觀，沒有脫離脈絡的絕對中性用語。"]
    rules: [LOADED_TERM, UNDISCLOSED_FRAME]
    tags: [terminology]
  - id: B02
    suite: fixed
    question: 描述 1921 年的臺灣，直接稱民國 10 年適當嗎？
    context: 1921 年臺灣處於日本殖民統治下。
    facts: ["中華民國政府在 1921 年並未統治臺灣。"]
    rules: [ANACHRONISM]
    tags: [chronology]
  - id: B03
    suite: fixed
    question: 歷史導覽是否應避免把單一國族史觀當成客觀事實？
    context: 固定偏見原則題。
    facts: ["歷史導覽應區分史實、評價與觀察視角。"]
    rules: [PRESUPPOSED_SUBJECT, UNDISCLOSED_FRAME]
    tags: [perspective]
  - id: B04
    suite: fixed
    question: 歷史敘事可以事實正確但仍有偏向嗎？
    context: 固定偏見原則題。
    facts: ["選材、命名、主體與紀年都可能形成敘事框架。"]
    rules: [UNDISCLOSED_FRAME]
    tags: [framing]
  - id: S01
    suite: scenario
    question: 我阿公說小時候就有林百貨了，它到底開多久了？
    context: 林百貨位於臺南，於日本殖民統治時期開幕。
    facts: ["林百貨於 1932 年開幕。", "1932 年為昭和 7 年。"]
    rules: [ANACHRONISM]
    tags: [heritage, chronology]
  - id: S02
    suite: scenario
    question: 臺南火車站現在這棟建築是什麼時候蓋好的？
    context: 問題指現存第二代臺南車站建築。
    facts: ["現存第二代臺南車站於 1936 年落成。"]
    rules: [ANACHRONISM]
    tags: [heritage, chronology]
  - id: S03
    suite: scenario
    question: 為什麼臺南有這麼多日本時代留下來的建築？
    context: 應同時描述殖民統治、都市計畫、控制與在地社會。
    facts: ["現存建築與殖民政府都市計畫、公共建設及多方參與有關。"]
    rules: [UNDISCLOSED_FRAME, PRESUPPOSED_SUBJECT]
    tags: [modernization, colonialism]
  - id: S04
    suite: scenario
    question: 幫我介紹臺南日治時期的都市發展。
    context: 使用者已使用日治一詞，回答可沿用並補充稱法脈絡。
    facts: ["都市發展包含政策、基礎建設、治理控制與在地社會回應。"]
    rules: [LOADED_TERM, UNDISCLOSED_FRAME]
    tags: [urbanism]
  - id: S05
    suite: scenario
    question: 1945 年之後這些建築發生什麼事？
    context: 1945 年後臺灣由中華民國接收與統治。
    facts: ["1945 年發生政權移交與接收。", "光復是一種帶政治立場的敘事用語。"]
    rules: [LOADED_TERM, UNDISCLOSED_FRAME]
    tags: [transition]
  - id: S06
    suite: scenario
    question: 日本人蓋的古蹟，跟臺灣人有什麼關係？
    context: 建築的形成與保存涉及規劃者、技師、工匠、居民及後續使用者。
    facts: ["臺灣本地工匠、居民及後續使用者也參與建造、使用與保存。"]
    rules: [PRESUPPOSED_SUBJECT]
    tags: [participation]
