[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lladar"
version = "0.15.0"
description = "Create questions, run an Agent, evaluate responses, and render reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "akasha-terminal[light]>=1.8",
  "requests>=2.31,<3",
  "urllib3>=2.7,<3",
  "pypdf>=4,<7",
  "playwright>=1.52,<2",
  "websockets>=15,<16",
  "pydantic-monty==1.1.0",
  "llama-index-core>=0.14.25",
  "tqdm>=4.66,<5",
  "certifi>=2026.10.19",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
lladar = "lladar.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "websockets>=15,<16"]
streamlit-test = ["streamlit>=1.57,<2"]

[tool.uv]
required-version = ">=0.13.4"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lladar = ["skill_assets/*/SKILL.md", "skill_assets/*/AUTHORING.md", "skill_assets/*/strategy.py", "template_assets/*.md", "locales/*.json", "localized_templates/*/*/*.md"]

[tool.pytest.ini_options]
addopts = "-q -m 'not browser' --basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"
testpaths = ["tests"]
markers = [
  "browser: tests that launch the explicitly provisioned Playwright Chromium browser",
  "live_gemini: opt-in tests that send synthetic answers to the real Gemini API and may incur charges",
]
