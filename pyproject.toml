[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lladar"
version = "0.6.0"
description = "Create questions, run an Agent, evaluate responses, and render reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "akasha-terminal[light]>=1.8",
  "requests>=2.31,<3",
  "pypdf>=4,<7",
  "playwright>=1.52,<2",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
lladar = "lladar.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lladar = ["skill_assets/*/SKILL.md", "skill_assets/*/strategy.py"]

[tool.pytest.ini_options]
addopts = "-q -m 'not browser'"
testpaths = ["tests"]
markers = [
  "browser: tests that launch the explicitly provisioned Playwright Chromium browser",
]
