name: Recoverable stage contracts
on:
  pull_request:
  push:
    branches: [main, "codex/terminal-status-*", "codex/api-guide-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and offline test dependencies
        run: python -m pip install -e ".[test]"
      - name: Exercise public contracts, persistence and process crashes
        run: python -m pytest tests/test_recoverable_generation.py tests/test_recoverable_evaluation.py tests/test_recoverable_report.py tests/test_recoverable_runner.py
      - name: Exercise terminal status queries and human input handoff
        run: python -m pytest tests/test_live_status.py tests/test_live_status_posix.py tests/test_progress.py tests/test_cli_log.py
      - name: Exercise document-driven HTTP APIs and portable adapters
        run: python -m pytest tests/test_api_guide.py tests/test_portable_api.py
