name: Test and publish to PyPI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out commit or PR merge result
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  browser-test:
    name: Browser capture (Playwright Chromium)
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit or PR merge result
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Provision the matching Chromium revision
        run: python -m playwright install --with-deps chromium

      - name: Run browser integration tests
        run: python -m pytest -m browser

  live-vibe-testing:
    name: Live vibe-testing (Gemini)
    needs: test
    # Fork PRs and Dependabot cannot receive the repository API secret.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXAMPLE_MODEL: ${{ vars.LLADAR_LIVE_MODEL || 'gemini-3-flash-preview' }}
    steps:
      - name: Require Gemini credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Set the GEMINI_API_KEY repository secret to run live vibe-testing."
            exit 1
          fi

      - name: Check out commit or PR merge result
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install controller, Graphify and isolated target
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . uv
          uv tool install --python "$(command -v python)" graphifyy==0.9.61
          python -m venv "$RUNNER_TEMP/lladar-live-target"
          "$RUNNER_TEMP/lladar-live-target/bin/python" -m pip install "langchain>=1,<2" "langchain-google-genai>=4,<5"

      - name: Verify real REST and graph workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/verify_rest_graph_live.py \
            --target-python "$RUNNER_TEMP/lladar-live-target/bin/python" \
            --model "gemini:$EXAMPLE_MODEL"

      - name: Verify real interface discovery and resume
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/verify_interface_confirmation_live.py \
            --target-python "$RUNNER_TEMP/lladar-live-target/bin/python" \
            --model "gemini:$EXAMPLE_MODEL"

      - name: Upload acceptance summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-vibe-testing-summary
          path: .lladar/live-*/verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Build and publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and release source
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag must match vX.Y or vX.Y.Z; got $GITHUB_REF_NAME."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag version ($tag_version) does not match pyproject.toml ($project_version)."
            exit 1
          fi

      - name: Verify tagged commit passed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_ci.py

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check browser extraction package boundaries
        run: python scripts/verify_browser_package.py dist

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
